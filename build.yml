name: Build Pemutar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate project
        run: |
          mkdir -p app/www
          cat > package.json <<'EOF'
          {
            "name": "pemutar",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.jebriel.pemutar",
            "appName": "Pemutar",
            "webDir": "app/www"
          }
          EOF
          cat > app/www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="id"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>Pemutar</title>
          <style>
          :root{--bg:#161326;--sf:#221d38;--tx:#f1eefc;--mu:#9a93b8;--ac:#ffb454;color-scheme:dark}
          @media(prefers-color-scheme:light){:root{--bg:#f4f1fb;--sf:#e4def5;--tx:#1d1833;--mu:#6a6288;--ac:#c2610a;color-scheme:light}}
          *{box-sizing:border-box;margin:0}html,body{height:100%}
          body{background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top,24px) 0 env(safe-area-inset-bottom)}
          #stage{background:#000;display:none}#stage.on{display:block}
          video{width:100%;max-height:34vh;display:block}
          #now{padding:12px 16px 2px}#title{font-weight:700;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          #sub{color:var(--mu);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#bar{padding:4px 16px}
          input[type=range]{width:100%;accent-color:var(--ac)}
          .t{display:flex;justify-content:space-between;color:var(--mu);font-size:.8rem}
          #ctl{display:flex;justify-content:center;align-items:center;gap:6px;padding:2px 8px}
          button{background:none;border:0;color:var(--tx);font-size:1.5rem;width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
          #pp{background:var(--ac);color:#1a1200;width:64px;height:64px}button.on{color:var(--ac)}
          #row{display:flex;gap:8px;padding:6px 16px}
          select,#q{background:var(--sf);color:var(--tx);border:0;border-radius:10px;height:42px;padding:0 10px;font:inherit}
          #q{flex:1;min-width:0}
          #list{flex:1;overflow:auto;list-style:none;padding:4px 8px 12px}
          #list li{padding:11px 10px;border-radius:10px;display:flex}
          #list li.cur{background:var(--sf);color:var(--ac)}
          #list li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          #msg{color:var(--mu);text-align:center;padding:30px 24px;line-height:1.5}
          </style></head><body>
          <div id="stage"><video id="m" controls playsinline></video></div><audio id="a"></audio>
          <div id="now"><div id="title">Memuat…</div><div id="sub"></div></div>
          <div id="bar"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posisi"><div class="t"><span id="cu">0:00</span><span id="du">0:00</span></div></div>
          <div id="ctl"><button id="sh" aria-label="Acak">⤮</button><button id="pv" aria-label="Sebelumnya">⏮</button>
          <button id="pp" aria-label="Putar">▶</button><button id="nx" aria-label="Berikutnya">⏭</button><button id="rp" aria-label="Ulangi">⟳</button></div>
          <div id="row"><select id="dir" aria-label="Folder"></select><input id="q" type="search" placeholder="Cari judul">
          <select id="sp" aria-label="Kecepatan"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select></div>
          <ul id="list"></ul>
          <script>
          const $=id=>document.getElementById(id),A=$('a'),V=$('m'),ML=Capacitor.registerPlugin('MediaLib');
          let el=A,ALL=[],L=[],i=-1,shuf=false,rep=0;
          const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
          const clean=n=>n.replace(/\.[^.]+$/,'');
          function render(){const u=$('list');u.innerHTML='';
          if(!L.length){u.innerHTML='<div id="msg">Tidak ada file media.</div>';return}
          const f=$('q').value.toLowerCase();
          L.forEach((t,k)=>{if(f&&!t.n.toLowerCase().includes(f))return;
          const l=document.createElement('li');if(k===i)l.className='cur';
          const s=document.createElement('span');s.textContent=(t.v?'🎬 ':'🎵 ')+clean(t.n);
          l.append(s);l.onclick=()=>play(k);u.append(l)})}
          function load(k){i=k;const t=L[k];A.pause();V.pause();el=t.v?V:A;
          $('stage').className=t.v?'on':'';el.src=Capacitor.convertFileSrc(t.u);el.playbackRate=+$('sp').value;
          $('title').textContent=clean(t.n);$('sub').textContent=t.f;
          render();const c=document.querySelector('#list li.cur');c&&c.scrollIntoView({block:'nearest'})}
          function play(k){load(k);el.play().catch(()=>{})}
          function next(auto){if(!L.length)return;let k;
          if(auto&&rep==2)k=i;else if(shuf)k=Math.floor(Math.random()*L.length);
          else{k=i+1;if(k>=L.length){if(auto&&!rep)return;k=0}}play(k)}
          function prev(){if(!L.length)return;if(el.currentTime>3){el.currentTime=0;return}play((i-1+L.length)%L.length)}
          [A,V].forEach(e=>{e.onended=()=>next(true);
          e.onplay=()=>{if(e===el)$('pp').textContent='⏸'};e.onpause=()=>{if(e===el)$('pp').textContent='▶'};
          e.ontimeupdate=()=>{if(e!==el)return;$('cu').textContent=fmt(e.currentTime);if(e.duration)$('seek').value=e.currentTime/e.duration*1000};
          e.onloadedmetadata=()=>{if(e===el)$('du').textContent=fmt(e.duration)};
          e.onerror=()=>{if(e===el)$('sub').textContent='Gagal memutar file ini'}});
          $('seek').oninput=e=>{if(el.duration)el.currentTime=e.target.value/1000*el.duration};
          $('pp').onclick=()=>{if(i<0){L.length&&play(0);return}el.paused?el.play():el.pause()};
          $('nx').onclick=()=>next(false);$('pv').onclick=prev;
          $('sh').onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle('on',shuf)};
          $('rp').onclick=e=>{rep=(rep+1)%3;const b=e.currentTarget;b.classList.toggle('on',rep>0);b.textContent=rep==2?'⟲₁':'⟳'};
          $('sp').onchange=e=>{el.playbackRate=+e.target.value};
          $('q').oninput=render;
          function filt(){const d=$('dir').value;L=d?ALL.filter(x=>x.f.split('/')[0]===d):ALL;i=-1;
          $('title').textContent=L.length+' file';$('sub').textContent='Pilih lagu atau video';render()}
          $('dir').onchange=filt;
          (async()=>{try{ALL=(await ML.list()).items}catch(e){$('title').textContent='Izin ditolak';
          $('list').innerHTML='<div id="msg">Izinkan akses musik &amp; video di pengaturan app, lalu buka ulang.</div>';return}
          const d=[...new Set(ALL.map(x=>x.f.split('/')[0]))].sort();
          $('dir').innerHTML='<option value="">Semua</option>'+d.map(x=>'<option>'+x+'</option>').join('');
          if(d.includes('Music'))$('dir').value='Music';filt()})();
          </script></body></html>
          EOF
          cat > MediaLibPlugin.java <<'EOF'
          package com.jebriel.pemutar;

          import android.content.ContentUris;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(name = "MediaLib", permissions = {
              @Permission(alias = "legacy", strings = {"android.permission.READ_EXTERNAL_STORAGE"}),
              @Permission(alias = "media", strings = {"android.permission.READ_MEDIA_AUDIO", "android.permission.READ_MEDIA_VIDEO"})
          })
          public class MediaLibPlugin extends Plugin {
              private String alias() { return Build.VERSION.SDK_INT >= 33 ? "media" : "legacy"; }

              @PluginMethod
              public void list(PluginCall call) {
                  if (getPermissionState(alias()) != PermissionState.GRANTED) {
                      requestPermissionForAlias(alias(), call, "permDone");
                      return;
                  }
                  run(call);
              }

              @PermissionCallback
              private void permDone(PluginCall call) {
                  if (getPermissionState(alias()) == PermissionState.GRANTED) run(call);
                  else call.reject("Izin ditolak");
              }

              private void run(PluginCall call) {
                  try {
                      JSArray items = new JSArray();
                      add(items, MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, false);
                      add(items, MediaStore.Video.Media.EXTERNAL_CONTENT_URI, true);
                      JSObject r = new JSObject();
                      r.put("items", items);
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              private void add(JSArray out, Uri base, boolean video) {
                  String[] proj = {"_id", "_display_name", "_data", "duration"};
                  try (Cursor c = getContext().getContentResolver().query(base, proj, null, null, "_display_name COLLATE NOCASE ASC")) {
                      if (c == null) return;
                      while (c.moveToNext()) {
                          String path = c.getString(2);
                          if (path == null) continue;
                          long dur = c.getLong(3);
                          if (!video) {
                              if (dur < 30000) continue;
                              if (path.contains("/Ringtones/") || path.contains("/Notifications/") || path.contains("/Alarms/") || path.contains("/Android/")) continue;
                          }
                          String rel = path;
                          String pre = "/storage/emulated/0/";
                          if (rel.startsWith(pre)) rel = rel.substring(pre.length());
                          else if (rel.startsWith("/")) rel = rel.substring(1);
                          int s = rel.lastIndexOf('/');
                          JSObject o = new JSObject();
                          o.put("n", c.getString(1));
                          o.put("f", s > 0 ? rel.substring(0, s) : "");
                          o.put("v", video);
                          o.put("d", dur / 1000.0);
                          o.put("u", ContentUris.withAppendedId(base, c.getLong(0)).toString());
                          out.put(o);
                      }
                  }
              }
          }
          EOF
          cat > MainActivity.java <<'EOF'
          package com.jebriel.pemutar;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaLibPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Add plugin and permissions
        run: |
          P=android/app/src/main/java/com/jebriel/pemutar
          cp MediaLibPlugin.java MainActivity.java $P/
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/><uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><application|' android/app/src/main/AndroidManifest.xml
          grep -c READ_MEDIA_AUDIO android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pemutar build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
